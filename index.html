<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="images/favicon-32x32.png" />
    <title>Build a Results Summary Component</title>

    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="content-container">
      <section id="left-section">
        <h3 class="result-info">Your Result</h3>
        <br />
        <div id="mainscore-container">
          <h1 class="scores" id="main-score">76</h1>
          <p class="scores" id="general-score">of 100</p>
        </div>
        <br />
        <h2>Great</h2>
        <div id="review-container">
          <p class="result-info" id="review">
            You scored higher than 65% of the people who have taken these tests
          </p>
        </div>
      </section>

      <section id="right-section">
        <h2 id="topic-name">Summary</h2>
        <div class="features" id="first-feature">
          <div class="feature-summary">
            <img src="images/icon-reaction.svg" alt="reaction icon" />
            <span id="name-firstfeature">Reaction</span>
          </div>
          <span><span class="individual-scores">80</span>/100</span>
        </div>
        <div class="features" id="second-feature">
          <div class="feature-summary">
            <img src="images/icon-memory.svg" alt="memory icon" />
            <span id="name-secondfeature">Memory</span>
          </div>
          <span><span class="individual-scores">92</span>/100</span>
        </div>
        <div class="features" id="third-feature">
          <div class="feature-summary">
            <img src="images/icon-verbal.svg" alt="verbal icon" />
            <span id="name-thirdfeature">Verbal</span>
          </div>
          <span><span class="individual-scores">61</span>/100</span>
        </div>
        <div class="features" id="fourth-feature">
          <div class="feature-summary">
            <img src="images/icon-visual.svg" alt="visual icon" />
            <span id="name-fourthfeature">Visual</span>
          </div>
          <span><span class="individual-scores">73</span>/100</span>
        </div>
        <br />
        <br />
        <button id="button-container">Continue</button>
      </section>
    </main>
  </body>
</html>

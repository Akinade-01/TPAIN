<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main class="container">
        <section class="S1">
<h2>Your Result</h2> <br>
<div class="circle">
    <h1><strong>76</strong></h1> 
    <p>of 100</p>
</div>
<br>
<h1>Great</h1> 
<p>You scored higher than 65% of the people who have taken these tests</p>
        </section>

        <section class="S2">
<h2>Summary</h2>
<div class="red">
    <span id="reaction">Reaction</span> 
    <span><strong>80</strong>
    <span>/100</span></span>
</div>
<div class="yellow">
    <span id="memory">Memory</span> 
    <span><strong>92</strong>
    <span>/100</span></span>
</div>
<div class="green">
    <span id="verbal">Verbal</span>
    <span><strong>61</strong>
    <span>/100</span></span>
</div>
<div class="blue">
    <span id="visual">Visual</span>
    <span><strong>73</strong>
    <span>/100</span></span>
</div> <br>
<button id="button">Continue</button>
        </section>
    </main>
</body>
</html>
